[project]
name = "yt-downloader"
version = "0.1.0"
description = "Local YouTube downloader: real format probe, clean UI, ffprobe-verified output."
requires-python = ">=3.12,<3.14"
# yt-dlp[default] minus the parts that ship no wheel on Windows on ARM.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "yt-dlp>=2025.11.12",
    # Browser impersonation; TikTok (and sometimes X/Facebook) refuse plain requests.
    "yt-dlp[curl-cffi]>=2025.11.12; sys_platform != 'win32' or (platform_machine != 'ARM64' and platform_machine != 'aarch64')",
    "yt-dlp-ejs>=0.3",
    "certifi",
    "requests",
    "urllib3",
    "websockets",
    "mutagen",
    "pycryptodomex",
    "brotli; sys_platform != 'win32' or (platform_machine != 'ARM64' and platform_machine != 'aarch64')",
    "pywebview>=5",
    # Dev runs only (the installed app bundles its own deno). No wheel for Windows on ARM.
    "deno>=2.5; sys_platform != 'win32' or (platform_machine != 'ARM64' and platform_machine != 'aarch64')",
]

[tool.uv]
package = false
# Never pick up whatever Python is already on the machine (a beta or a
# free-threaded build has no wheels): use uv's own CPython 3.12.
python-preference = "only-managed"

[dependency-groups]
build = ["pyinstaller>=6.10", "pillow"]
